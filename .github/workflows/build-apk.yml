name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets Folder
        run: |
          mkdir -p www
          cp -r index.html style.css game.js manifest.json sw.js www/
          if [ -d "assets" ]; then cp -r assets www/; fi

      - name: Initialize Mobile Capacitor App
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Zuma Deluxe" "com.zuma.deluxe" --web-dir "www"
          npx cap add android

      - name: Sync Game Files to Android Project
        run: |
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: |
          cd android
          chmod +x ./gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Zuma-Deluxe-Mobile-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
